services:
  - type: web
    name: damged-cars-scanner
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: damged-cars-db
          property: internalConnectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          name: damged-cars-scanner
          property: url
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: damged-cars-db
    region: frankfurt
    plan: free
    databaseName: damaged_cars_db
    user: damaged_cars_user
