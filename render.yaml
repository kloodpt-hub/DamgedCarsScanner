services:
  - type: web
    name: damged-cars-scanner
    env: node
    region: frankfurt
    plan: free
    buildCommand: bash render-build.sh
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: damged-cars-db
          property: internalConnectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          name: damged-cars-scanner
          property: url
      - key: CRON_SECRET
        generateValue: true
      - key: SEED_TOKEN
        generateValue: true

  - type: worker
    name: damged-cars-worker
    env: node
    region: frankfurt
    plan: free
    buildCommand: bash render-build.sh
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: damged-cars-db
          property: internalConnectionString
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/ms-playwright

databases:
  - name: damged-cars-db
    region: frankfurt
    plan: free
    databaseName: damaged_cars_db
    user: damaged_cars_user
